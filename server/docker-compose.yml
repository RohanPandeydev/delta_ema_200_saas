services:
  ema_trading_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_bot_avi_da_rsi_sma_test_two_way
    restart: unless-stopped # Change from always
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env # Mount .env for live updates
    networks:
      - trading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    # Remove healthcheck temporarily to avoid restarts
    deploy:
      resources:
        limits:
          cpus: "1.0" # Increase CPU
          memory: 1G # Increase memory to 1GB

  config_bot:
    build:
      context: .
      dockerfile: Dockerfile.config-bot
    container_name: trading_config_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata
    volumes:
      - ./:/app # Access to all files
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - trading-network
    depends_on:
      - ema_trading_bot
    privileged: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trading-network:
    driver: bridge
