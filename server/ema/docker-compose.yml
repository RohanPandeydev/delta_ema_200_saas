services:
  ema_trading_bot:
    build: .
    container_name: ema_delta_trading_bot_updated
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata
    volumes:
      # Mount logs directory for persistence
      - ./logs:/app/logs
      # Mount .env file as read-only
      - ./.env:/app/.env:ro
      # Optional: Mount config if you want to modify without rebuild
      - ./config.py:/app/config.py:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/logs') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Optional: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M